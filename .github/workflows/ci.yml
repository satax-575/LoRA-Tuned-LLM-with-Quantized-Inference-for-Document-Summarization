# ============================================================
# CI Pipeline - QLoRA Llama 3.1 8B Document Summarization
# Runs on every push and pull request to main/develop.
#
# Jobs:
#   1. lint    -> ruff code-style check
#   2. test    -> pytest (CPU-only, no GPU needed)
#   3. coverage -> enforce minimum 30% threshold (grows with Step 6)
# ============================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel any in-progress run for the same branch when a new push arrives.
# This saves CI minutes on rapid pushes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------
  # JOB 1: Lint - ruff checks style, unused imports, etc.
  # ----------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install "ruff>=0.4.0"

      - name: Run ruff linter
        # --output-format=github formats errors so GitHub annotates them
        # inline on the PR diff - very readable.
        run: ruff check . --output-format=github

  # ----------------------------------------------------------
  # JOB 2 + 3: Test + Coverage - pytest with no-GPU filter
  # ----------------------------------------------------------
  test:
    name: Test and Coverage (CPU-only)
    runs-on: ubuntu-latest
    # Run lint first - no point testing broken code
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # Cache pip packages between runs - speeds up CI by ~60%
          cache: pip

      - name: Install CPU-only test dependencies
        # We install only what is needed for CPU tests, NOT the heavy
        # ML stack (torch, vllm, bitsandbytes). This keeps CI fast
        # (under 2 min) and free. GPU-dependent tests are skipped with -m "not gpu".
        run: |
          pip install --upgrade pip
          pip install \
            "pytest>=8.2.0" \
            "pytest-asyncio>=0.23.0" \
            "pytest-cov>=5.0.0" \
            "httpx>=0.27.0" \
            "fastapi>=0.111.0" \
            "pydantic>=2.7.0" \
            "pydantic-settings>=2.3.0" \
            "redis>=5.0.7" \
            "prometheus-client>=0.20.0" \
            "python-dotenv>=1.0.1" \
            "loguru>=0.7.2" \
            "slowapi>=0.1.9" \
            "starlette>=0.37.2" \
            "uvicorn>=0.30.0" \
            "pyyaml>=6.0.1" \
            "rouge-score>=0.1.2" \
            "numpy>=1.26.0"

      - name: Set required environment variables
        # The FastAPI app reads these at import time via pydantic-settings.
        # We use dummy values - no real GPU or Redis needed for unit tests.
        run: |
          echo "API_KEY=ci-test-key-not-real" >> $GITHUB_ENV
          echo "REDIS_URL=redis://localhost:6379" >> $GITHUB_ENV
          echo "AWQ_MODEL_DIR=./outputs/awq_model" >> $GITHUB_ENV
          echo "HF_TOKEN=hf_dummy_ci_token" >> $GITHUB_ENV

      - name: Create outputs directory
        run: mkdir -p outputs/coverage

      - name: Run CPU-safe tests with coverage
        # -m "not gpu"         -> skip any test marked @pytest.mark.gpu
        # --cov-fail-under=30  -> fail CI if coverage drops below 30%
        #                         (we raise this threshold in Step 6)
        # -x                   -> stop on first failure for faster feedback
        run: |
          pytest -m "not gpu" \
            --cov=inference \
            --cov=evaluation \
            --cov=data \
            --cov-report=term-missing \
            --cov-report=xml:outputs/coverage/coverage.xml \
            --cov-fail-under=30 \
            -x \
            -v

      - name: Upload coverage report as artifact
        # Saves the coverage XML so it can be downloaded from the
        # GitHub Actions run page - useful for debugging low coverage.
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: outputs/coverage/coverage.xml
          retention-days: 14
