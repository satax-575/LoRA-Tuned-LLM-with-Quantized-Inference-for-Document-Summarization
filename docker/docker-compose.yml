# ============================================================
# Docker Compose — QLoRA Llama 3.1 8B Production Stack
#
# Services:
#   redis       — Redis cache (required)
#   api         — FastAPI inference backend (requires GPU)
#   demo        — Gradio UI (optional)
#   prometheus  — Metrics scraping (optional)
#   grafana     — Metrics visualization (optional)
#
# Usage:
#   # Full stack (requires NVIDIA GPU):
#   docker-compose up -d
#
#   # API + Redis only:
#   docker-compose up -d redis api
#
#   # CPU-only (no GPU, HF fallback inference):
#   docker-compose --profile cpu up -d
# ============================================================

version: "3.9"

services:

  # ── Redis Cache ──────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: qlora-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - qlora-network

  # ── FastAPI Inference API ────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: qlora-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - API_KEY=${API_KEY}
      - REDIS_URL=redis://redis:6379
      - REDIS_TTL=3600
      - AWQ_MODEL_DIR=/models/awq_model
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - LOG_LEVEL=info
      - JSON_LOGS=true
      - CUDA_VISIBLE_DEVICES=0
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - GPU_MEMORY_UTIL=0.85
      - MAX_MODEL_LEN=2048
    volumes:
      - ../outputs:/app/outputs
      - model-cache:/models
      - api-logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - qlora-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 15s
      start_period: 120s
      retries: 3

  # ── Gradio Demo ──────────────────────────────────────────
  demo:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: qlora-demo
    restart: unless-stopped
    ports:
      - "7860:7860"
    environment:
      - API_URL=http://api:8000
      - API_KEY=${API_KEY}
      - GRADIO_PORT=7860
    command: ["python", "demo/app.py"]
    depends_on:
      api:
        condition: service_healthy
    networks:
      - qlora-network

  # ── Prometheus ───────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: qlora-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    networks:
      - qlora-network
    depends_on:
      - api

  # ── Grafana ──────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.1.0
    container_name: qlora-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_DOMAIN=localhost
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - qlora-network

# ── Volumes ──────────────────────────────────────────────
volumes:
  redis-data:
  model-cache:
  api-logs:
  prometheus-data:
  grafana-data:

# ── Networks ─────────────────────────────────────────────
networks:
  qlora-network:
    driver: bridge
