# ============================================================
# Prometheus Configuration — QLoRA Llama 3.1 8B
# Scrapes the FastAPI /metrics/prometheus endpoint
# ============================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: "qlora-llama31-summarization"
    environment: "production"

scrape_configs:

  # ── FastAPI Inference API ────────────────────────────────
  - job_name: "qlora-api"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: "/metrics/prometheus"
    # If API key is required, pass it as a header:
    # (Uncomment and set your API_KEY)
    # authorization:
    #   type: "ApiKey"
    #   credentials: "your_api_key_here"
    scrape_interval: 10s
    scrape_timeout: 5s

  # ── Redis ───────────────────────────────────────────────
  # Uncomment to add Redis Exporter for cache metrics
  # - job_name: "redis"
  #   static_configs:
  #     - targets: ["redis-exporter:9121"]

  # ── Prometheus self-monitoring ──────────────────────────
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
