[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "qlora-llm-summarization"
version = "2.0.0"
description = "QLoRA-Tuned Llama 3.1 8B for Domain-Adaptive Document Summarization"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Environment :: GPU :: NVIDIA CUDA",
]

[project.scripts]
qlora-train     = "training.train:main"
qlora-serve     = "inference.main:main"
qlora-quantize  = "quantization.awq_quantize:main"
qlora-benchmark = "evaluation.benchmark:main"
qlora-demo      = "demo.app:main"

[tool.setuptools.packages.find]
exclude = ["tests*", "notebooks*", "outputs*", "data/processed*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["inference", "training", "data", "evaluation", "quantization"]
omit = ["tests/*", "conftest.py", "*/migrations/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "except ImportError",
    "pass",
]

# ── Ruff linter configuration ──────────────────────────────────────────────────
# ruff is a fast Python linter (replaces flake8 + isort + pyupgrade).
# These rules are enforced in CI via: ruff check . --output-format=github
[tool.ruff]
# Line length: 100 chars is generous enough for ML code with long model/path names.
line-length = 100
# Target Python 3.11 — ruff uses this to know which syntax features are valid.
target-version = "py311"

[tool.ruff.lint]
# Rule sets we enforce:
#   E  — pycodestyle errors (indentation, whitespace, syntax)
#   F  — pyflakes (undefined names, unused imports, unused variables)
#   W  — pycodestyle warnings
#   I  — isort (import ordering)
select = ["E", "F", "W", "I"]

# Rules we explicitly ignore:
#   E501 — "line too long" — already handled by line-length = 100 above.
#           ruff reformats via `ruff format`, so we don't need the lint rule too.
#   F401 — "imported but unused" in __init__.py files — common for public re-exports.
ignore = ["E501"]

# Don't auto-fix these rules (too risky to auto-change):
unfixable = ["F841"]  # local variable assigned but never used

[tool.ruff.lint.per-file-ignores]
# Test files: allow assert statements and unused imports (fixtures imported for side effects)
"tests/*" = ["F401", "F811"]
# __init__.py: imports are re-exports, not unused
"*/__init__.py" = ["F401"]
